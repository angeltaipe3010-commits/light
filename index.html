<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Linterna</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 20%, #14141a 0%, #0a0a0c 60%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #f2f2f2;
    padding: 24px;
    text-align: center;
    transition: background 0.4s ease;
  }
  body.lit { background: radial-gradient(circle at 50% 20%, #241f10 0%, #0a0a0c 65%); }

  .icon-wrap {
    width: 140px;
    height: 140px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 40px;
  }
  #flashlightIcon {
    width: 90px;
    height: 90px;
    stroke: #6b6b70;
    fill: none;
    stroke-width: 1.5;
    transition: all 0.3s ease;
  }
  #flashlightIcon.on {
    stroke: #ffb700;
    filter: drop-shadow(0 0 18px rgba(255, 183, 0, 0.7));
  }

  #status {
    margin-bottom: 32px;
    font-size: 0.85rem;
    color: #8a8a8e;
    max-width: 300px;
    min-height: 1.2em;
  }

  .buttons {
    display: flex;
    gap: 16px;
  }
  button {
    border: none;
    border-radius: 12px;
    padding: 16px 28px;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.15s ease, opacity 0.15s ease, box-shadow 0.2s ease;
    font-family: inherit;
  }
  button:active { transform: scale(0.96); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  #onBtn {
    background: #ffb700;
    color: #1a1a1a;
  }
  #offBtn {
    background: #000;
    color: #f2f2f2;
    border: 1px solid #333;
  }

  /* ---- Liquid glass modal ---- */
  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(6, 6, 8, 0.55);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    align-items: center;
    justify-content: center;
    padding: 24px;
    z-index: 10;
  }
  .overlay.show { display: flex; }

  .modal {
    position: relative;
    background: linear-gradient(180deg, rgba(255,255,255,0.14), rgba(255,255,255,0.05));
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 26px;
    padding: 30px 26px 26px;
    max-width: 360px;
    width: 100%;
    text-align: center;
    box-shadow:
      0 24px 70px rgba(0,0,0,0.55),
      inset 0 1px 0 rgba(255,255,255,0.25),
      inset 0 0 40px rgba(255,255,255,0.03);
    overflow: hidden;
  }
  .modal::before {
    content: "";
    position: absolute;
    top: -60%;
    left: -20%;
    width: 140%;
    height: 140%;
    background: radial-gradient(circle at 30% 20%, rgba(255,183,0,0.16), transparent 55%);
    pointer-events: none;
  }

  .close-x {
    position: absolute;
    top: 14px;
    right: 14px;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.14);
    color: #cfcfd2;
    font-size: 0.85rem;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    cursor: pointer;
  }

  /* Header del pago */
  .payment-header {
    position: relative;
    margin-bottom: 20px;
  }
  .payment-header .lock-icon {
    width: 46px;
    height: 46px;
    margin: 0 auto 12px;
    border-radius: 50%;
    background: rgba(255,183,0,0.14);
    border: 1px solid rgba(255,183,0,0.3);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .payment-header .lock-icon svg { width: 22px; height: 22px; stroke: #ffb700; fill: none; stroke-width: 2; }
  .payment-header h2 { font-size: 1.1rem; margin: 0 0 6px; font-weight: 700; position: relative; color: #fff; }
  .payment-header .price-row {
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 6px;
    position: relative;
  }
  .payment-header .price-row .amount { font-size: 2.2rem; font-weight: 800; color: #ffd257; }
  .payment-header .price-row .period { font-size: 0.85rem; color: #9a9a9e; font-weight: 500; }

  /* Formulario */
  .payment-form {
    position: relative;
    text-align: left;
  }
  .form-group {
    margin-bottom: 14px;
  }
  .form-group label {
    display: block;
    font-size: 0.78rem;
    font-weight: 600;
    color: #b8b8bc;
    margin-bottom: 5px;
    padding-left: 2px;
  }
  .form-group input {
    width: 100%;
    padding: 12px 14px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.15);
    background: rgba(0,0,0,0.25);
    color: #f2f2f2;
    font-size: 0.95rem;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }
  .form-group input::placeholder { color: #6a6a6e; }
  .form-group input:focus {
    border-color: rgba(255,183,0,0.6);
    box-shadow: 0 0 0 3px rgba(255,183,0,0.1);
  }
  .form-group input.error {
    border-color: #ff6b6b;
    box-shadow: 0 0 0 3px rgba(255,107,107,0.15);
  }
  .form-row {
    display: flex;
    gap: 12px;
  }
  .form-row .form-group {
    flex: 1;
    margin-bottom: 0;
  }

  .error-msg {
    font-size: 0.75rem;
    color: #ff6b6b;
    margin-top: 4px;
    min-height: 0;
    display: none;
  }
  .error-msg.show { display: block; }

  .msg-line {
    min-height: 18px;
    font-size: 0.78rem;
    font-weight: 600;
    margin-bottom: 14px;
    position: relative;
    text-align: center;
  }
  .msg-line.declined { color: #ff6b6b; }
  .msg-line.success { color: #5fd87d; }

  #payBtn {
    background: linear-gradient(180deg, #ffcf4d, #ffb700);
    color: #1a1400;
    width: 100%;
    padding: 15px;
    border-radius: 14px;
    box-shadow: 0 8px 22px rgba(255,183,0,0.35), inset 0 1px 0 rgba(255,255,255,0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-weight: 700;
    font-size: 0.95rem;
    border: none;
    cursor: pointer;
  }
  #cancelBtn {
    background: rgba(255,255,255,0.06);
    color: #b8b8bc;
    border: 1px solid rgba(255,255,255,0.12);
    width: 100%;
    padding: 12px;
    border-radius: 14px;
    font-weight: 600;
    font-size: 0.85rem;
    margin-top: 10px;
    cursor: pointer;
  }

  .fine-print {
    margin-top: 14px;
    font-size: 0.7rem;
    color: #7a7a7e;
    position: relative;
  }

  .spinner {
    width: 16px;
    height: 16px;
    border: 2px solid rgba(26,20,0,0.35);
    border-top-color: #1a1400;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    display: inline-block;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Pantalla de exito */
  .success-screen {
    display: none;
    position: relative;
    text-align: center;
    padding: 10px 0;
  }
  .success-screen.show { display: block; }
  .success-icon {
    width: 60px;
    height: 60px;
    margin: 0 auto 16px;
    border-radius: 50%;
    background: rgba(95,216,125,0.15);
    border: 1px solid rgba(95,216,125,0.35);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .success-icon svg { width: 28px; height: 28px; stroke: #5fd87d; fill: none; stroke-width: 2.5; }
  .success-screen h2 { font-size: 1.3rem; margin: 0 0 8px; font-weight: 700; color: #5fd87d; }
  .success-screen p { font-size: 0.9rem; color: #c7c7cb; margin: 0 0 20px; }
</style>
</head>
<body>

<div class="icon-wrap">
  <svg id="flashlightIcon" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
    <path d="M20 8 H44 L40 22 H24 Z" stroke-linejoin="round"/>
    <path d="M24 22 H40 V30 L34 36 V56 H30 V36 L24 30 Z" stroke-linejoin="round"/>
    <line x1="32" y1="2" x2="32" y2="8"/>
  </svg>
</div>

<div id="status">Toca "Encender" para activar la linterna.</div>

<div class="buttons">
  <button id="onBtn">Encender</button>
  <button id="offBtn">Apagar</button>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <button class="close-x" id="cancelBtn2" aria-label="Cerrar">&#10005;</button>

    <!-- Formulario de pago -->
    <div id="paymentFormContainer">
      <div class="payment-header">
        <div class="lock-icon">
          <svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        </div>
        <h2>Pago con Tarjeta</h2>
        <div class="price-row">
          <span class="amount">$50</span>
          <span class="period">USD &middot; Pago Único</span>
        </div>
      </div>

      <form class="payment-form" id="paymentForm" novalidate>
        <div class="form-group">
          <label for="cardHolder">Titular de la tarjeta</label>
          <input type="text" id="cardHolder" placeholder="NOMBRE APELLIDO" autocomplete="off">
          <div class="error-msg" id="errHolder">Completa el nombre del titular.</div>
        </div>

        <div class="form-group">
          <label for="cardNumber">Número de tarjeta</label>
          <input type="text" id="cardNumber" placeholder="0000 0000 0000 0000" maxlength="19" autocomplete="off" inputmode="numeric">
          <div class="error-msg" id="errNumber">Ingresa el número de tarjeta.</div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="cardExp">Expiración</label>
            <input type="text" id="cardExp" placeholder="MM/AA" maxlength="5" autocomplete="off" inputmode="numeric">
            <div class="error-msg" id="errExp">Ingresa la fecha.</div>
          </div>
          <div class="form-group">
            <label for="cardCvv">Código de seguridad</label>
            <input type="text" id="cardCvv" placeholder="CVV" maxlength="4" autocomplete="off" inputmode="numeric">
            <div class="error-msg" id="errCvv">Ingresa el CVV.</div>
          </div>
        </div>

        <div class="msg-line" id="msgLine"></div>

        <button type="submit" id="payBtn"><span id="payBtnText">Procesar Pago</span></button>
        <button type="button" id="cancelBtn">Cancelar</button>
      </form>

      <div class="fine-print">Pago seguro &middot; procesado una sola vez</div>
    </div>

    <!-- Pantalla de éxito -->
    <div class="success-screen" id="successScreen">
      <div class="success-icon">
        <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <h2>¡Pago Exitoso!</h2>
      <p>Tu transacción fue procesada correctamente.</p>
    </div>
  </div>
</div>

<script>
let track = null;
let isOn = false;
let processing = false;

const body = document.body;
const icon = document.getElementById('flashlightIcon');
const status = document.getElementById('status');
const onBtn = document.getElementById('onBtn');
const offBtn = document.getElementById('offBtn');
const overlay = document.getElementById('overlay');
const payBtn = document.getElementById('payBtn');
const payBtnText = document.getElementById('payBtnText');
const cancelBtn = document.getElementById('cancelBtn');
const cancelBtn2 = document.getElementById('cancelBtn2');
const msgLine = document.getElementById('msgLine');
const paymentFormContainer = document.getElementById('paymentFormContainer');
const successScreen = document.getElementById('successScreen');
const paymentForm = document.getElementById('paymentForm');

const cardHolder = document.getElementById('cardHolder');
const cardNumber = document.getElementById('cardNumber');
const cardExp = document.getElementById('cardExp');
const cardCvv = document.getElementById('cardCvv');

async function initCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' } }
    });
    track = stream.getVideoTracks()[0];
    const capabilities = track.getCapabilities ? track.getCapabilities() : {};
    if (!capabilities.torch) {
      status.textContent = 'Este dispositivo o navegador no soporta el control del flash (prueba con Android + Chrome).';
      onBtn.disabled = true;
      return false;
    }
    return true;
  } catch (err) {
    status.textContent = 'No se pudo acceder a la cámara: ' + err.message;
    onBtn.disabled = true;
    return false;
  }
}

async function setTorch(state) {
  await track.applyConstraints({ advanced: [{ torch: state }] });
  isOn = state;
  icon.classList.toggle('on', state);
  body.classList.toggle('lit', state);
  status.textContent = state ? 'Linterna encendida.' : 'Linterna apagada.';
}

function resetForm() {
  paymentForm.reset();
  [cardHolder, cardNumber, cardExp, cardCvv].forEach(el => el.classList.remove('error'));
  document.querySelectorAll('.error-msg').forEach(el => el.classList.remove('show'));
  msgLine.textContent = '';
  msgLine.className = 'msg-line';
  payBtnText.textContent = 'Procesar Pago';
  payBtn.disabled = false;
  cancelBtn.disabled = false;
}

function openModal() {
  resetForm();
  paymentFormContainer.style.display = 'block';
  successScreen.classList.remove('show');
  overlay.classList.add('show');
}

function closeModal() {
  overlay.classList.remove('show');
  setTimeout(() => {
    paymentFormContainer.style.display = 'block';
    successScreen.classList.remove('show');
  }, 300);
}

onBtn.addEventListener('click', async () => {
  if (!track) {
    onBtn.disabled = true;
    onBtn.textContent = '...';
    const ok = await initCamera();
    onBtn.disabled = false;
    onBtn.textContent = 'Encender';
    if (!ok) return;
  }
  try {
    await setTorch(true);
  } catch (err) {
    status.textContent = 'Error al encender: ' + err.message;
  }
});

offBtn.addEventListener('click', () => {
  if (!isOn) {
    status.textContent = 'La linterna ya está apagada.';
    return;
  }
  openModal();
});

// Formato automático de número de tarjeta
cardNumber.addEventListener('input', (e) => {
  let val = e.target.value.replace(/\D/g, '');
  val = val.substring(0, 16);
  const parts = val.match(/.{1,4}/g);
  e.target.value = parts ? parts.join(' ') : val;
});

// Formato automático de fecha
cardExp.addEventListener('input', (e) => {
  let val = e.target.value.replace(/\D/g, '');
  val = val.substring(0, 4);
  if (val.length >= 3) {
    e.target.value = val.substring(0, 2) + '/' + val.substring(2);
  } else {
    e.target.value = val;
  }
});

// Solo números en CVV
cardCvv.addEventListener('input', (e) => {
  e.target.value = e.target.value.replace(/\D/g, '').substring(0, 4);
});

function validateForm() {
  let valid = true;
  [cardHolder, cardNumber, cardExp, cardCvv].forEach(el => el.classList.remove('error'));
  document.querySelectorAll('.error-msg').forEach(el => el.classList.remove('show'));

  if (!cardHolder.value.trim()) {
    cardHolder.classList.add('error');
    document.getElementById('errHolder').classList.add('show');
    valid = false;
  }
  if (!cardNumber.value.trim()) {
    cardNumber.classList.add('error');
    document.getElementById('errNumber').classList.add('show');
    valid = false;
  }
  if (!cardExp.value.trim()) {
    cardExp.classList.add('error');
    document.getElementById('errExp').classList.add('show');
    valid = false;
  }
  if (!cardCvv.value.trim()) {
    cardCvv.classList.add('error');
    document.getElementById('errCvv').classList.add('show');
    valid = false;
  }

  return valid;
}

paymentForm.addEventListener('submit', (e) => {
  e.preventDefault();
  if (processing) return;

  if (!validateForm()) return;

  processing = true;
  payBtn.disabled = true;
  cancelBtn.disabled = true;
  payBtnText.innerHTML = '<span class="spinner"></span> Procesando pago...';
  msgLine.textContent = '';
  msgLine.className = 'msg-line';

  setTimeout(() => {
    processing = false;
    paymentFormContainer.style.display = 'none';
    successScreen.classList.add('show');

    setTimeout(async () => {
      closeModal();
      try {
        await setTorch(false);
      } catch (err) {
        status.textContent = 'Error al apagar: ' + err.message;
      }
    }, 1800);
  }, 1500);
});

function cancelModal() {
  if (processing) return;
  closeModal();
}
cancelBtn.addEventListener('click', cancelModal);
cancelBtn2.addEventListener('click', cancelModal);
</script>

</body>
</html>
