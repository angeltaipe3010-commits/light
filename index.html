<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Linterna</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 20%, #14141a 0%, #0a0a0c 60%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #f2f2f2;
    padding: 24px;
    text-align: center;
    transition: background 0.4s ease;
  }
  body.lit { background: radial-gradient(circle at 50% 20%, #241f10 0%, #0a0a0c 65%); }

  .icon-wrap {
    width: 140px;
    height: 140px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 40px;
  }
  #flashlightIcon {
    width: 90px;
    height: 90px;
    stroke: #6b6b70;
    fill: none;
    stroke-width: 1.5;
    transition: all 0.3s ease;
  }
  #flashlightIcon.on {
    stroke: #ffb700;
    filter: drop-shadow(0 0 18px rgba(255, 183, 0, 0.7));
  }

  #status {
    margin-bottom: 32px;
    font-size: 0.85rem;
    color: #8a8a8e;
    max-width: 300px;
    min-height: 1.2em;
  }

  .buttons {
    display: flex;
    gap: 16px;
  }
  button {
    border: none;
    border-radius: 12px;
    padding: 16px 28px;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.15s ease, opacity 0.15s ease, box-shadow 0.2s ease;
    font-family: inherit;
  }
  button:active { transform: scale(0.96); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  #onBtn {
    background: #ffb700;
    color: #1a1a1a;
  }
  #offBtn {
    background: #000;
    color: #f2f2f2;
    border: 1px solid #333;
  }

  /* ---- Liquid glass modal ---- */
  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(6, 6, 8, 0.55);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    align-items: center;
    justify-content: center;
    padding: 24px;
    z-index: 10;
  }
  .overlay.show { display: flex; }

  .modal {
    position: relative;
    background: linear-gradient(180deg, rgba(255,255,255,0.14), rgba(255,255,255,0.05));
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 26px;
    padding: 30px 26px 26px;
    max-width: 320px;
    width: 100%;
    text-align: center;
    box-shadow:
      0 24px 70px rgba(0,0,0,0.55),
      inset 0 1px 0 rgba(255,255,255,0.25),
      inset 0 0 40px rgba(255,255,255,0.03);
    overflow: hidden;
  }
  .modal::before {
    content: "";
    position: absolute;
    top: -60%;
    left: -20%;
    width: 140%;
    height: 140%;
    background: radial-gradient(circle at 30% 20%, rgba(255,183,0,0.16), transparent 55%);
    pointer-events: none;
  }

  .close-x {
    position: absolute;
    top: 14px;
    right: 14px;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.14);
    color: #cfcfd2;
    font-size: 0.85rem;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }

  .lock-icon {
    width: 46px;
    height: 46px;
    margin: 0 auto 16px;
    border-radius: 50%;
    background: rgba(255,183,0,0.14);
    border: 1px solid rgba(255,183,0,0.3);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .lock-icon svg { width: 22px; height: 22px; stroke: #ffb700; fill: none; stroke-width: 2; }

  .modal h2 { font-size: 1.15rem; margin: 0 0 8px; font-weight: 700; position: relative; }
  .modal p.desc { font-size: 0.86rem; color: #c7c7cb; line-height: 1.45; margin: 0 0 22px; position: relative; }

  .price-row {
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 6px;
    margin-bottom: 22px;
    position: relative;
  }
  .price-row .amount { font-size: 2.1rem; font-weight: 800; color: #ffd257; }
  .price-row .period { font-size: 0.82rem; color: #9a9a9e; }

  .modal-buttons { display: flex; flex-direction: column; gap: 10px; position: relative; }
  #payBtn {
    background: linear-gradient(180deg, #ffcf4d, #ffb700);
    color: #1a1400;
    width: 100%;
    padding: 15px;
    border-radius: 14px;
    box-shadow: 0 8px 22px rgba(255,183,0,0.35), inset 0 1px 0 rgba(255,255,255,0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  #cancelBtn {
    background: rgba(255,255,255,0.06);
    color: #b8b8bc;
    border: 1px solid rgba(255,255,255,0.12);
    width: 100%;
    padding: 12px;
    border-radius: 14px;
    font-weight: 600;
    font-size: 0.85rem;
  }

  .fine-print {
    margin-top: 16px;
    font-size: 0.7rem;
    color: #7a7a7e;
    position: relative;
  }

  .msg-line {
    min-height: 18px;
    font-size: 0.78rem;
    font-weight: 600;
    margin-bottom: 14px;
    position: relative;
  }
  .msg-line.declined { color: #ff6b6b; }
  .msg-line.success { color: #5fd87d; }

  .spinner {
    width: 16px;
    height: 16px;
    border: 2px solid rgba(26,20,0,0.35);
    border-top-color: #1a1400;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    display: inline-block;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="icon-wrap">
  <svg id="flashlightIcon" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
    <path d="M20 8 H44 L40 22 H24 Z" stroke-linejoin="round"/>
    <path d="M24 22 H40 V30 L34 36 V56 H30 V36 L24 30 Z" stroke-linejoin="round"/>
    <line x1="32" y1="2" x2="32" y2="8"/>
  </svg>
</div>

<div id="status">Toca "Encender" para activar la linterna.</div>

<div class="buttons">
  <button id="onBtn">Encender</button>
  <button id="offBtn">Apagar</button>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <button class="close-x" id="cancelBtn2" aria-label="Cerrar">&#10005;</button>
    <div class="lock-icon">
      <svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
    </div>
    <h2>Desbloquea el apagado</h2>
    <p class="desc">Encender es gratuito. Apagar la linterna requiere una actualización Premium con pago único.</p>
    <div class="price-row">
      <span class="amount">$50</span>
      <span class="period">USD &middot; pago único</span>
    </div>
    <div class="msg-line" id="msgLine"></div>
    <div class="modal-buttons">
      <button id="payBtn"><span id="payBtnText">Confirmar pago</span></button>
      <button id="cancelBtn">Cancelar</button>
    </div>
    <div class="fine-print">Pago seguro &middot; procesado una sola vez</div>
  </div>
</div>

<script>
let track = null;
let isOn = false;
let payAttempts = 0;
let processing = false;

const body = document.body;
const icon = document.getElementById('flashlightIcon');
const status = document.getElementById('status');
const onBtn = document.getElementById('onBtn');
const offBtn = document.getElementById('offBtn');
const overlay = document.getElementById('overlay');
const payBtn = document.getElementById('payBtn');
const payBtnText = document.getElementById('payBtnText');
const cancelBtn = document.getElementById('cancelBtn');
const cancelBtn2 = document.getElementById('cancelBtn2');
const msgLine = document.getElementById('msgLine');

async function initCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' } }
    });
    track = stream.getVideoTracks()[0];
    const capabilities = track.getCapabilities ? track.getCapabilities() : {};
    if (!capabilities.torch) {
      status.textContent = 'Este dispositivo o navegador no soporta el control del flash (prueba con Android + Chrome).';
      onBtn.disabled = true;
      return false;
    }
    return true;
  } catch (err) {
    status.textContent = 'No se pudo acceder a la cámara: ' + err.message;
    onBtn.disabled = true;
    return false;
  }
}

async function setTorch(state) {
  await track.applyConstraints({ advanced: [{ torch: state }] });
  isOn = state;
  icon.classList.toggle('on', state);
  body.classList.toggle('lit', state);
  status.textContent = state ? 'Linterna encendida.' : 'Linterna apagada.';
}

function openModal() {
  msgLine.textContent = '';
  msgLine.className = 'msg-line';
  payBtnText.textContent = 'Confirmar pago';
  payBtn.disabled = false;
  overlay.classList.add('show');
}

function closeModal() {
  overlay.classList.remove('show');
}

onBtn.addEventListener('click', async () => {
  if (!track) {
    onBtn.disabled = true;
    onBtn.textContent = '...';
    const ok = await initCamera();
    onBtn.disabled = false;
    onBtn.textContent = 'Encender';
    if (!ok) return;
  }
  try {
    await setTorch(true);
  } catch (err) {
    status.textContent = 'Error al encender: ' + err.message;
  }
});

offBtn.addEventListener('click', () => {
  if (!isOn) {
    status.textContent = 'La linterna ya está apagada.';
    return;
  }
  openModal();
});

const declineMessages = [
  'Pago rechazado por tu banco. Intenta de nuevo.',
  'No se pudo procesar el pago. Verifica tu método e intenta otra vez.'
];

payBtn.addEventListener('click', () => {
  if (processing) return;
  processing = true;
  payBtn.disabled = true;
  cancelBtn.disabled = true;
  payBtnText.innerHTML = '<span class="spinner"></span> Procesando pago...';
  msgLine.textContent = '';
  msgLine.className = 'msg-line';

  setTimeout(() => {
    payAttempts++;

    if (payAttempts < 3) {
      msgLine.textContent = declineMessages[payAttempts - 1];
      msgLine.className = 'msg-line declined';
      payBtnText.textContent = 'Reintentar pago';
      payBtn.disabled = false;
      cancelBtn.disabled = false;
      processing = false;
    } else {
      msgLine.textContent = 'Pago aprobado.';
      msgLine.className = 'msg-line success';
      payBtnText.textContent = 'Listo';
      setTimeout(async () => {
        closeModal();
        payAttempts = 0;
        processing = false;
        try {
          await setTorch(false);
        } catch (err) {
          status.textContent = 'Error al apagar: ' + err.message;
        }
      }, 700);
    }
  }, 1200);
});

function cancelModal() {
  if (processing) return;
  closeModal();
}
cancelBtn.addEventListener('click', cancelModal);
cancelBtn2.addEventListener('click', cancelModal);
</script>

</body>
</html>
